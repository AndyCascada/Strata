name: Daily Analysis

on:
  # NOTE: The nightly schedule is disabled until the DigitalOcean droplet is
  # provisioned. While it was enabled, every run failed at the SSH step (no
  # server to connect to) and emailed a failure notice daily. Re-enable the
  # `schedule` block below once the droplet + DO_SSH_* secrets are live.
  #
  # schedule:
  #   - cron: "0 6 * * *"  # 2am ET (UTC-4 summer) / 1am ET (UTC-5 winter)
  workflow_dispatch:      # allow manual trigger from GitHub UI
    inputs:
      date:
        description: "Date to analyze (YYYY-MM-DD). Defaults to yesterday."
        required: false

jobs:
  analyze:
    name: Fetch and analyze headlines
    runs-on: ubuntu-latest

    steps:
      - name: SSH into droplet and run analysis
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_SSH_HOST }}
          username: ${{ secrets.DO_SSH_USER }}
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/strata/apps/web

            # Load env vars from the server's .env file
            export $(grep -v '^#' .env | sed 's/"//g' | xargs)
            export DATABASE_URL="file:$(pwd)/dev.db"

            # Run analysis for the given date or yesterday
            if [ -n "${{ github.event.inputs.date }}" ]; then
              npx tsx scripts/daily-analysis.ts ${{ github.event.inputs.date }}
            else
              npx tsx scripts/daily-analysis.ts
            fi
